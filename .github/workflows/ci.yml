name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yorvi
          POSTGRES_PASSWORD: yorvi_local_password
          POSTGRES_DB: yorvi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yorvi -d yorvi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://yorvi:yorvi_local_password@127.0.0.1:5432/yorvi
      ALLOW_DEMO_AUTH: 'false'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: node --test scripts/max-auth-test.mjs
      - run: node --test scripts/photo-policy-test.mjs
      - name: Verify production migrations are repeatable
        run: |
          node scripts/migrate-db.mjs
          node scripts/migrate-db.mjs
      - name: Verify migrations do not insert demo users
        run: |
          node --input-type=module -e "import pg from 'pg'; const c=new pg.Client({connectionString:process.env.DATABASE_URL}); await c.connect(); const result=await c.query('SELECT count(*)::int AS n FROM users'); await c.end(); if(result.rows[0].n!==0)process.exit(1)"
      - run: node scripts/prepare-db.mjs
      - run: node scripts/integration-test.mjs
      - run: node scripts/integration-write-test.mjs
      - run: node scripts/integration-max-auth-test.mjs
      - name: Start isolated S3 storage for photo integration
        run: |
          docker run -d --name yorvi-s3-ci \
            -p 127.0.0.1:8333:8333 \
            -e AWS_ACCESS_KEY_ID=yorvi_local_access \
            -e AWS_SECRET_ACCESS_KEY=yorvi_local_secret_change_before_deploy \
            -e S3_BUCKET=yorvi-private \
            chrislusf/seaweedfs:latest
      - name: Create private test photo bucket
        run: node scripts/setup-minio.mjs
        env:
          S3_ENDPOINT: http://127.0.0.1:8333
      - name: Verify signed upload, gallery and sold privacy
        run: node scripts/integration-photo-minio-test.mjs
        env:
          S3_ENDPOINT: http://127.0.0.1:8333
      - name: Validate production Docker Compose
        run: docker compose --env-file deploy/production.env.example -f compose.production.yml config --quiet
      - name: Build production API container
        run: docker build -f deploy/Dockerfile.api -t yonvi-api:ci .
      - name: Build production web container
        run: docker build -f deploy/Dockerfile.web -t yonvi-web:ci .
      - name: Validate Caddy configuration
        run: docker run --rm -e YONVI_DOMAIN=example.com yonvi-web:ci caddy validate --config /etc/caddy/Caddyfile
