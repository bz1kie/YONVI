name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yorvi
          POSTGRES_PASSWORD: yorvi_local_password
          POSTGRES_DB: yorvi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yorvi -d yorvi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://yorvi:yorvi_local_password@127.0.0.1:5432/yorvi
      ALLOW_DEMO_AUTH: 'false'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: node --test scripts/max-auth-test.mjs
      - run: node --test scripts/photo-policy-test.mjs
      - run: node scripts/prepare-db.mjs
      - run: node scripts/integration-test.mjs
      - run: node scripts/integration-write-test.mjs
      - run: node scripts/integration-max-auth-test.mjs
      - name: Start isolated MinIO for photo integration
        run: |
          docker run -d --name yorvi-minio-ci \
            -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=yorvi_local_access \
            -e MINIO_ROOT_PASSWORD=yorvi_local_secret_change_before_deploy \
            quay.io/minio/minio:RELEASE.2025-02-07T23-21-09Z server /data --address ":9000"
      - name: Create private test photo bucket
        run: node scripts/setup-minio.mjs
      - name: Verify signed upload, gallery and sold privacy
        run: node scripts/integration-photo-minio-test.mjs
