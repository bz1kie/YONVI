services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yorvi
      POSTGRES_PASSWORD: yorvi_local_password
      POSTGRES_DB: yorvi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - yorvi_pgdata:/var/lib/postgresql/data
      - ./packages/database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
  storage:
    image: chrislusf/seaweedfs:latest
    environment:
      AWS_ACCESS_KEY_ID: yorvi_local_access
      AWS_SECRET_ACCESS_KEY: yorvi_local_secret_change_before_deploy
      S3_BUCKET: yorvi-private
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - yorvi_s3_data:/data
volumes:
  yorvi_pgdata:
  yorvi_s3_data:
